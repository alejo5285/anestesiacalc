  return (
    <div

    </div>
  );

`,"PageNotFound.jsx":`import React from 'react';
import { useNavigate } from 'react-router-dom';

export default function PageNotFound() {
  const navigate = useNavigate();

  return (
    <div
      className="min-h-screen w-full bg-[#0A0E1A] flex flex-col items-center justify-center px-6 text-center"
      style={{
        paddingTop: 'env(safe-area-inset-top)',
        paddingBottom: 'env(safe-area-inset-bottom)',
      }}
    >
      <div className="max-w-[380px] w-full">
        <div className="mb-6 inline-flex h-16 w-16 items-center justify-center rounded-full bg-[#00E5FF]/10 border border-[#00E5FF]/20">
          <span className="text-2xl">∅</span>
        </div>

        <h1 className="text-[56px] font-black tracking-tighter text-white leading-none">
          404
        </h1>
        <p className="mt-3 text-white/60 text-[15px] leading-relaxed">
          Esta ruta no existe en la versión WebView.
          Verifica la navegación nativa.
        </p>

        <button
          onClick={() => navigate('/')}
          className="mt-8 w-full rounded-full bg-[#00E5FF] text-black font-semibold
                     min-h-[44px] px-6 py-3 text-[14px] tracking-wide
                     active:scale-[0.98] transition-transform
                     touch-manipulation"
        >
          Volver al inicio
        </button>

        <p className="mt-4 text-[11px] text-white/25">
          Safe-area padding aplicado • 44px touch target
        </p>
      </div>
    </div>
  );
}

export default function Calculator() {
  const [pullDistance, setPullDistance] = useState(0);
  const [isRefreshing, setIsRefreshing] = useState(false);
  const startY = useRef(0);
  const containerRef = useRef(null);

  // Simulates app state check - used in WebView review
  const checkAppState = useCallback(async () => {
    setIsRefreshing(true);
    // Simulate network / calculation reload
    await new Promise((r) => setTimeout(r, 1400));
    setIsRefreshing(false);
    setPullDistance(0);
  }, []);

  const onTouchStart = (e) => {
    if (containerRef.current?.scrollTop === 0) {
      startY.current = e.touches[0].clientY;
    }
  };

  const onTouchMove = (e) => {
    if (containerRef.current?.scrollTop !== 0 || isRefreshing) return;
    const currentY = e.touches[0].clientY;
    const diff = currentY - startY.current;
    if (diff > 0) {
      // Dampen pull for native feel
      setPullDistance(Math.min(diff * 0.55, 120));
    }
  };

  const onTouchEnd = async () => {
    if (pullDistance > 60) {
      await checkAppState();
    } else {
      setPullDistance(0);
    }
  };

  return (
    <div
      ref={containerRef}
      className="relative min-h-screen bg-[#0A0E1A] overflow-auto"
      onTouchStart={onTouchStart}
      onTouchMove={onTouchMove}
      onTouchEnd={onTouchEnd}
      style={{
        paddingTop: 'env(safe-area-inset-top)',
        overscrollBehavior: 'contain',
      }}
    >
      {/* Pull-to-refresh indicator */}
      <div
        className="flex justify-center pointer-events-none"
        style={{ height: pullDistance, transition: isRefreshing ? 'none' : 'height 0.2s' }}
      >
        <AnimatePresence>
          {(pullDistance > 10 || isRefreshing) && (
            <motion.div
              initial={{ opacity: 0, scale: 0.8, y: -10 }}
              animate={{ 
                opacity: 1, 
                scale: 1, 
                y: 0,
                rotate: isRefreshing ? 360 : pullDistance * 1.5
              }}
              exit={{ opacity: 0, scale: 0.8, y: -10 }}
              transition={
                isRefreshing
                  ? { rotate: { repeat: Infinity, duration: 0.8, ease: 'linear' } }
                  : { type: 'spring', stiffness: 300, damping: 20 }
              }
              className="mt-3 h-9 w-9 rounded-full bg-[#121A2B] border border-[#00E5FF]/30

            >
              <motion.div
                animate={isRefreshing ? { rotate: 360 } : {}}
                transition={isRefreshing ? { repeat: Infinity, duration: 0.8, ease: 'linear' } : {}}
                className="h-5 w-5 rounded-full border-2 border-white/20 border-t-[#00E5FF]"
              />
            </motion.div>
          )}
        </AnimatePresence>
      </div>

      {/* Calculator content */}
      <div className="px-4 pb-8">
        <h2 className="text-white font-semibold">AnestesiaCalc</h2>
        <p className="text-white/50 text-sm mt-1">
          Pull {'>'} 60px para recargar • Spinner con Framer Motion
        </p>
      </div>
    </div>
  );
}
`,"App.jsx":`import React, { useState, useEffect, useRef } from 'react';
import { BrowserRouter, Routes, Route, useLocation, useNavigate } from 'react-router-dom';
import { motion, AnimatePresence } from 'framer-motion';
import AuthLayout from './AuthLayout';
import DrugsSection from './DrugsSection';
import Calculator from './Calculator';
import PageNotFound from './PageNotFound';

// --- Tab cache to preserve inputs/search when swapping ---
const useTabCache = () => {
  const cacheRef = useRef({});
  
  const preserveCalculatorState = (key, data) => {
    cacheRef.current[key] = {
      ...data,
      timestamp: Date.now(),
    };
  };

  const restoreState = (key) => cacheRef.current[key] || null;

  return { preserveCalculatorState, restoreState, cacheRef };
};

function AnimatedRoutes() {
  const location = useLocation();
  const { preserveCalculatorState, restoreState } = useTabCache();
  const [tabCache, setTabCache] = useState({});

  // Example: cache search params before route change
  useEffect(() => {
    const params = new URLSearchParams(location.search);
    if (location.pathname.includes('calculator')) {
      setTabCache(prev => ({
        ...prev,
        calculator: { 
          search: location.search,
          scroll: window.scrollY,
          query: params.get('q') || ''
        }
      }));
      preserveCalculatorState('calculator', { 
        search: location.search,
        scroll: window.scrollY 
      });
    }
  }, [location.pathname, location.search]);

  return (
    <AnimatePresence mode="wait">
      <Routes location={location} key={location.pathname}>
        <Route
          path="/login"
          element={
            <motion.div
              initial={{ opacity: 0, x: 20 }}
              animate={{ opacity: 1, x: 0 }}
              exit={{ opacity: 0, x: -20 }}
              transition={{ duration: 0.25, ease: [0.22, 1, 0.36, 1] }}
            >
              <AuthLayout>
                <h1>Login</h1>
                {/* ... */}
              </AuthLayout>
            </motion.div>
          }
        />
        <Route
          path="/register"
          element={
            <motion.div
              initial={{ opacity: 0, x: 20 }}
              animate={{ opacity: 1, x: 0 }}
              exit={{ opacity: 0, x: -20 }}
              transition={{ duration: 0.25, ease: [0.22, 1, 0.36, 1] }}
            >
              <AuthLayout>
                <h1>Register</h1>
              </AuthLayout>
            </motion.div>
          }
        />
        <Route
          path="/calculator"
          element={
            <motion.div
              initial={{ opacity: 0, x: 20 }}
              animate={{ opacity: 1, x: 0 }}
              exit={{ opacity: 0, x: -20 }}
              transition={{ duration: 0.25, ease: [0.22, 1, 0.36, 1] }}
            >
              <Calculator
                cachedState={tabCache.calculator || restoreState('calculator')}
                onStateChange={(s) => preserveCalculatorState('calculator', s)}
              />
            </motion.div>
          }
        />
        <Route path="*" element={
          <motion.div
            initial={{ opacity: 0, x: 20 }}
            animate={{ opacity: 1, x: 0 }}
            exit={{ opacity: 0, x: -20 }}
            transition={{ duration: 0.25 }}
          >
            <PageNotFound />
          </motion.div>
        } />
      </Routes>
    </AnimatePresence>
  );
}

export default function App() {
  return (
    <BrowserRouter>
      <AnimatedRoutes />
    </BrowserRouter>
  );
}
